<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список людей</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2>Управление данными</h2>

    <form th:action="@{/persons/search}" method="post" class="row g-3 my-3">
        <div class="col-md-3">
            <select name="criteria" class="form-select">
                <option value="lastName">По фамилии</option>
                <option value="city">По городу</option>
                <option value="gender">По полу</option>
            </select>
        </div>
        <div class="col-md-5">
            <input type="text" name="keyword" class="form-control" placeholder="Введите поисковый запрос...">
        </div>
        <div class="col-md-4">
            <button type="submit" class="btn btn-secondary">Найти</button>
            <a th:href="@{/persons}" class="btn btn-outline-dark">Сбросить</a>
            <a th:href="@{/persons/new}" class="btn btn-primary float-end">Добавить</a>
        </div>
    </form>

    <table class="table table-striped table-hover bg-white shadow-sm rounded">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>ФИО</th>
            <th>Город</th>
            <th>Адрес</th>
            <th>Телефон</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${persons}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.lastName + ' ' + p.firstName}"></td>
            <td th:text="${p.address.city.name}"></td>
            <td th:text="${p.address.street + ', д. ' + p.address.house}"></td>
            <td th:text="${p.phoneNumber}"></td>
            <td>
                <a th:href="@{'/persons/edit/' + ${p.id}}" class="btn btn-sm btn-warning">Изменить</a>
                <a th:href="@{'/persons/delete/' + ${p.id}}" class="btn btn-sm btn-danger" onclick="return confirm('Удалить?')">Удалить</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
