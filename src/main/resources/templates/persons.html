<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список людей</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Список людей</h2>
        <a th:href="@{/persons/new}" class="btn btn-primary">Добавить человека</a>
    </div>

    <div th:if="${#lists.isEmpty(persons)}" class="alert alert-info">
        Список пуст.
    </div>

    <table th:if="${!#lists.isEmpty(persons)}" class="table table-striped table-hover shadow-sm bg-white rounded">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>ФИО</th>
            <th>Пол</th>
            <th>Телефон</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="person : ${persons}">
            <td th:text="${person.id}"></td>
            <td th:text="${person.lastName + ' ' + person.firstName + ' ' + (person.middleName != null ? person.middleName : '')}"></td>
            <td th:text="${person.gender}"></td>
            <td th:text="${person.phoneNumber}"></td>
            <td>
                <a th:href="@{'/persons/details/' + ${person.id}}" class="btn btn-sm btn-info text-white">Детали</a>
                <a th:href="@{'/persons/edit/' + ${person.id}}" class="btn btn-sm btn-warning">Редактировать</a>
                <a th:href="@{'/persons/delete/' + ${person.id}}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Удалить запись?')">Удалить</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
