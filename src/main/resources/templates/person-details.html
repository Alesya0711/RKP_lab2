<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Детали</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="card-title mb-0">Информация о человеке</h3>
        </div>
        <div class="card-body">
            <ul class="list-group list-group-flush">
                <li class="list-group-item"><strong>ID:</strong> <span th:text="${person.id}"></span></li>
                <li class="list-group-item"><strong>Фамилия:</strong> <span th:text="${person.lastName}"></span></li>
                <li class="list-group-item"><strong>Имя:</strong> <span th:text="${person.firstName}"></span></li>
                <li class="list-group-item"><strong>Отчество:</strong> <span th:text="${person.middleName}"></span></li>
                <li class="list-group-item"><strong>Пол:</strong> <span th:text="${person.gender}"></span></li>
                <li class="list-group-item"><strong>Национальность:</strong> <span th:text="${person.nationality}"></span></li>
                <li class="list-group-item"><strong>Рост:</strong> <span th:text="${person.height} + ' см'"></span></li>
                <li class="list-group-item"><strong>Вес:</strong> <span th:text="${person.weight} + ' кг'"></span></li>
                <li class="list-group-item"><strong>Дата рождения:</strong> <span th:text="${person.birthDate}"></span></li>
                <li class="list-group-item"><strong>Телефон:</strong> <span th:text="${person.phoneNumber}"></span></li>
            </ul>
        </div>
        <div class="card-footer d-flex justify-content-between">
            <a th:href="@{/persons}" class="btn btn-secondary">Назад к списку</a>
            <a th:href="@{'/persons/edit/' + ${person.id}}" class="btn btn-warning">Редактировать</a>
        </div>
    </div>
</div>
</body>
</html>
