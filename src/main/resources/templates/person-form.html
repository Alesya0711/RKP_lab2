<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма человека</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 700px;">
    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <h3 class="card-title mb-0" th:text="${person.id == null ? 'Добавить человека' : 'Редактировать человека'}"></h3>
        </div>
        <div class="card-body">
            <form th:action="@{/persons/save}" th:object="${person}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <input type="hidden" th:field="*{address.id}"/>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Фамилия:</label>
                        <input type="text" class="form-control" th:field="*{lastName}"/>
                        <div class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Имя:</label>
                        <input type="text" class="form-control" th:field="*{firstName}"/>
                        <div class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Отчество:</label>
                        <input type="text" class="form-control" th:field="*{middleName}"/>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Пол:</label>
                        <select class="form-select" th:field="*{gender}">
                            <option value="Мужской">Мужской</option>
                            <option value="Женский">Женский</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Национальность:</label>
                        <input type="text" class="form-control" th:field="*{nationality}"/>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Рост (см):</label>
                        <input type="number" step="0.1" class="form-control" th:field="*{height}"/>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Вес (кг):</label>
                        <input type="number" step="0.1" class="form-control" th:field="*{weight}"/>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Дата рождения:</label>
                        <input type="date" class="form-control" th:field="*{birthDate}"/>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Телефон:</label>
                    <input type="text" class="form-control" th:field="*{phoneNumber}"/>
                </div>

                <hr>
                <h5 class="text-secondary">Адрес проживания</h5>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Город:</label>
                        <select class="form-select" name="address.city.id" required>
                            <option value="">Выберите город...</option>
                            <option th:each="city : ${cities}"
                                    th:value="${city.id}"
                                    th:text="${city.name} + ' (' + ${city.postalCode} + ')'"
                                    th:selected="${person.address != null and person.address.city != null and person.address.city.id == city.id}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Улица:</label>
                        <input type="text" class="form-control" th:field="*{address.street}"/>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Дом:</label>
                        <input type="text" class="form-control" th:field="*{address.house}"/>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Квартира:</label>
                        <input type="text" class="form-control" th:field="*{address.apartment}"/>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a th:href="@{/persons}" class="btn btn-secondary">Отмена</a>
                    <button type="submit" class="btn btn-success">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
